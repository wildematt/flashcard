ton></div></dialog><script type="module">
import { t as initTicket } from './_astro/signupTicket.BSWhIEkT.js';
const dlg = document.getElementById('flashcard');
const ticket = document.querySelector('[data-ticket]');
const assetBase = new URL('_astro/', document.baseURI).href;
const DEFAULT_MARK = assetBase + 'logo.svg';
const DEFAULT_TITLE = 'Hello!';
const DEFAULT_DESC = 'You have officially great\ntaste in holograms.';

const bar = dlg.querySelector('[data-skin-bar]');
const panel = dlg.querySelector('[data-edit-panel]');
const editBtn = dlg.querySelector('[data-edit-toggle]');
const dropzone = panel.querySelector('[data-dropzone]');
const dropLabel = panel.querySelector('[data-drop-label]');
const fileInput = panel.querySelector('[data-logo-file]');
const resetAllBtn = panel.querySelector('[data-reset-all]');
const titleInput = panel.querySelector('[data-edit-title]');
const descInput = panel.querySelector('[data-edit-desc]');
const titleEl = document.querySelector('[data-ticket-title]');
const descEl = document.querySelector('[data-ticket-description]');

const esc = v => v.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const applyTitle = v => { titleEl.dataset.foilText = v; titleEl.textContent = v; };
const applyDesc = v => { descEl.dataset.foilText = v; descEl.innerHTML = v.split('\n').map(esc).join('<br data-astro-cid-bvaltcfr>'); };

// ticket asset URLs (absolute: relative url() in inline custom properties
// resolves inconsistently across engines) + persisted customizations,
// applied before the ticket controller captures its originals
const savedLogo = localStorage.getItem('fc-logo');
ticket.style.setProperty('--ticket-mask', `url("${assetBase}ticket-mask.Dktmghxg.svg")`);
ticket.style.setProperty('--foil-texture', `url("${assetBase}foil-texture.Dr5ahRY6.webp")`);
ticket.style.setProperty('--ticket-mark', `url("${savedLogo || DEFAULT_MARK}")`);
dropLabel.textContent = savedLogo ? 'Custom logo ✓' : 'Upload logo image';
const savedTitle = localStorage.getItem('fc-title');
const savedDesc = localStorage.getItem('fc-desc');
applyTitle(savedTitle || DEFAULT_TITLE);
applyDesc(savedDesc || DEFAULT_DESC);
titleInput.value = savedTitle || '';
descInput.value = savedDesc || '';

// ---- skins ----
const SKINS = ['aurora', 'amber', 'emerald', 'amethyst', 'rose', 'onyx-silver'];
const dots = [...bar.querySelectorAll('[data-skin-set]')];
let sweepAnim;
const shineSweep = () => {
  const el = document.querySelector('[data-ticket-sweep]');
  if (!el) return;
  sweepAnim?.cancel();
  sweepAnim = el.animate(
    [{ transform: 'translateX(-70%)', opacity: 0 }, { opacity: .65, offset: .35 }, { opacity: .45, offset: .65 }, { transform: 'translateX(70%)', opacity: 0 }],
    { duration: 600, easing: 'linear' });
};
const applySkin = (skin, announce) => {
  if (!SKINS.includes(skin)) skin = 'aurora';
  dlg.dataset.skin = skin;
  dots.forEach(d => d.setAttribute('aria-pressed', String(d.dataset.skinSet === skin)));
  localStorage.setItem('fc-skin', skin);
  if (announce) shineSweep();
};
bar.addEventListener('click', e => {
  const dot = e.target.closest('[data-skin-set]');
  if (dot) applySkin(dot.dataset.skinSet, true);
});
applySkin(localStorage.getItem('fc-skin') || 'aurora', false);

// ---- edit panel ----
const setLogo = (url, save) => {
  ticket.style.setProperty('--ticket-mark', `url("${url}")`);
  dropLabel.textContent = save ? 'Custom logo ✓' : 'Upload logo image';
  if (save) localStorage.setItem('fc-logo', url); else localStorage.removeItem('fc-logo');
};
function readFile(f) {
  if (!f || !f.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = () => { setLogo(reader.result, true); shineSweep(); };
  reader.readAsDataURL(f);
}
editBtn.addEventListener('click', () => dlg.toggleAttribute('data-edit-open'));
dlg.addEventListener('click', e => {
  if (!dlg.hasAttribute('data-edit-open')) return;
  if (e.target.closest('[data-edit-toggle]') || e.target.closest('[data-edit-panel]')) return;
  dlg.removeAttribute('data-edit-open');
});
dropzone.addEventListener('click', () => fileInput.click());
for (const t of ['dragover', 'dragenter']) dropzone.addEventListener(t, e => { e.preventDefault(); dropzone.dataset.over = ''; });
for (const t of ['dragleave', 'drop']) dropzone.addEventListener(t, e => { e.preventDefault(); delete dropzone.dataset.over; });
dropzone.addEventListener('drop', e => readFile(e.dataTransfer?.files?.[0]));
fileInput.addEventListener('change', () => { readFile(fileInput.files?.[0]); fileInput.value = ''; });
resetAllBtn.addEventListener('click', () => {
  setLogo(DEFAULT_MARK, false);
  titleInput.value = '';
  descInput.value = '';
  applyTitle(DEFAULT_TITLE);
  applyDesc(DEFAULT_DESC);
  localStorage.removeItem('fc-title');
  localStorage.removeItem('fc-desc');
  shineSweep();
});
titleInput.addEventListener('input', () => {
  applyTitle(titleInput.value.trim() ? titleInput.value : DEFAULT_TITLE);
  localStorage.setItem('fc-title', titleInput.value);
});
descInput.addEventListener('input', () => {
  applyDesc(descInput.value.trim() ? descInput.value : DEFAULT_DESC);
  localStorage.setItem('fc-desc', descInput.value);
});

// ---- open + entrance ----
initTicket(dlg);
dlg.showModal();
requestAnimationFrame(() => requestAnimationFrame(() => { dlg.dataset.motionState = 'open'; }));
setTimeout(() => {
  dlg.dispatchEvent(new CustomEvent('signup:statechange', { detail: { state: 'success', ownsFocus: false } }));
}, 750);
setTimeout(() => { dlg.dataset.uiReady = ''; }, 1300);
